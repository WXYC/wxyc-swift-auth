name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test (host)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app
      # Behavior runs on the host, whose SDK is newer than the declared floors.
      # The floors get their own compile checks in `platforms` below.
      - run: swift test

  platforms:
    name: build ${{ matrix.name }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            destination: generic/platform=iOS
            settings: ""
          - name: watchOS
            destination: generic/platform=watchOS
            settings: ""
          # The declared macOS floor is 14.0 while the runner's SDK is far
          # newer, so an ordinary macOS build proves nothing about it. Pinning
          # the deployment target is what makes this a floor check.
          - name: macOS 14 floor
            destination: generic/platform=macOS
            settings: MACOSX_DEPLOYMENT_TARGET=14.0
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app
      - run: |
          xcodebuild build \
            -scheme WXYCAuth \
            -destination '${{ matrix.destination }}' \
            ${{ matrix.settings }} \
            -quiet
